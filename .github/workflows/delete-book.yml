name: 删除一本书及全部内容
on:
  workflow_dispatch:
    inputs:
      book:
        description: 选择要删除的书（包括旧版中的该书）
        required: true
        type: choice
        options:
          - choices
          - wholebrain
          - stepdad
          - world-order
          - missing
          - on-china
          - sapiens
          - homo-deus
          - 21-lessons
      confirmation:
        description: 再次输入所选书籍ID确认删除
        required: true
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: reading-atlas-content-management
  cancel-in-progress: false
jobs:
  delete:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 删除并更新全部版本目录
        env:
          BOOK_ID: ${{ inputs.book }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/delete_book.py --slug "$BOOK_ID" --confirm "$CONFIRMATION"
      - name: 保存删除结果
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Remove selected book and all published versions'
            git push
          fi
      - name: 重新发布网站
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
